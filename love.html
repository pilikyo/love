<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>LOVE</title>
       <link rel="icon" href="">
       <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-dark ">
       <div class="row">
              
              <div class="col-lg-6 col-sm-12 col-md-12 mx-auto">
                           
                     <h3 class="text-uppercase text-danger text-center mt-5 display-1">💘My Heart Belongs to You</h3>  
                     <div class="card mx-auto mt-5 p-3 light shadow border border-danger border-5" style="width: 100%;">
                            <img src="love.png" class=" shadow card-img-top w-100 ">
                            <div class="card-header mt-3  border border-dark border-3 " style="height: 50%; width:100%">
                            <audio src="LANGGA - Wilbert Ross (Official Music Video).mp3" class="mx-auto  " controls style="width: 100%; max-width: 25%;"></audio>
                             </div>
                  </div>
                  <div class="card mx-auto mt-5 p-3 light shadow border border-danger border-5" style="width: 100%;">
                     <div class="alert alert-danger text-center alert-dismissible">
                            <strong class="text-uppercase">Click Heart</strong><p class="text-uppercase"> to see how much i like you!!</p>
                            <button class="btn-close" data-bs-dismiss="alert" ></button>
                     </div>
                           <div class="card-header mx-auto shadow">
                                      <span class="mx-auto" style="font-size: 5rem; cursor: pointer;" data-bs-target="#open" data-bs-toggle="collapse"  >💌</span>
                           </div>
                          <div class=" mt-5 collapse" id="open">
                                  <img src="Letter.jpg" class="h-100 w-100" alt="Letter">
                          </div>
                  </div>
              </div>
       </div>
       <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
